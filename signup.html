<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign Up – Ci-NDA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Helvetica Neue',Arial,sans-serif;background:#141414;color:#fff;display:flex;flex-direction:column;min-height:100vh}
    .navbar{padding:20px 50px;display:flex;justify-content:space-between;align-items:center;background:#141414}
    .logo{font-size:32px;font-weight:bold;color:#e50914;letter-spacing:2px;cursor:pointer}
    .container{flex:1;display:flex;align-items:center;justify-content:center;padding:50px 20px}
    .card{background:#1f1f1f;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:50px;width:100%;max-width:450px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
    h1{font-size:28px;margin-bottom:10px}
    p{color:#999;margin-bottom:30px;line-height:1.6}
    label{font-size:14px;color:#b3b3b3;display:block;margin-bottom:8px}
    input{width:100%;padding:15px;background:#333;border:none;border-radius:4px;color:#fff;font-size:16px;margin-bottom:20px}
    input:focus{outline:none;background:#454545}
    button{width:100%;padding:15px;background:#e50914;border:none;border-radius:4px;color:#fff;font-weight:600;font-size:16px;cursor:pointer}
    button:hover{background:#f40612}
    .login{text-align:center;margin-top:20px;font-size:14px}
    .login a{color:#e50914;text-decoration:none}
    @media(max-width:768px){.navbar{padding:20px}h1{font-size:24px}.card{padding:30px}}
  </style>
</head>
<body>
<nav class="navbar">
  <div class="logo" onclick="location='index.html'">Ci-NDA</div>
</nav>

<div class="container">
  <div class="card">
    <h1>Create Account</h1>
    <p>Join Africa’s fastest-growing film community.</p>

    <form id="signupForm">
      <label>Full name</label>
      <input type="text" id="name" placeholder="John Doe" required>
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
      <label>Password</label>
      <input type="password" id="password" placeholder="Min. 6 characters" required>
      <label>User type</label>
      <select id="userType" style="width:100%;padding:15px;background:#333;color:#fff;border:none;border-radius:4px;margin-bottom:20px">
        <option value="filmmaker">Filmmaker</option>
        <option value="mentor">Mentor</option>
        <option value="sponsor">Sponsor</option>
      </select>
      <button type="submit">Create Account</button>
    </form>

    <div class="login">
      Already have an account? <a href="authentication.html">Sign in</a>
    </div>
  </div>
</div>

<script>
document.getElementById('signupForm').addEventListener('submit', e => {
  e.preventDefault();
  alert(' Account created (mock). Welcome to Ci-NDA!');
  location = 'authentication.html';
});
</script>
</body>
</html>
