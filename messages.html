<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="cinda-theme.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Messages - CI-NDA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            touch-action: manipulation;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        button, input {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .header {
            background: rgba(20, 20, 20, 0.95);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(229, 9, 20, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h2 {
            font-size: 18px;
            font-weight: 600;
        }
        .header .mentor-name {
            color: #e50914;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }
        .message.sent {
            align-self: flex-end;
            background: #e50914;
            color: #fff;
        }
        .message.received {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .message-time {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }
        .input-area {
            background: rgba(20, 20, 20, 0.95);
            padding: 15px 20px;
            border-top: 1px solid rgba(229, 9, 20, 0.2);
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .input-area input:focus {
            border-color: #e50914;
        }
        .input-area button {
            padding: 12px 24px;
            background: #e50914;
            border: none;
            border-radius: 24px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .input-area button:hover {
            background: #f40612;
            transform: translateY(-2px);
        }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
            padding: 20px;
            text-align: center;
        }
        @media (max-width: 768px) {
            body {
                font-size: 14px;
            }
            .message {
                max-width: 82%;
                padding: 10px 14px;
                font-size: 13px;
                border-radius: 10px;
            }
            .header {
                padding: 14px 16px;
            }
            .header h2 {
                font-size: 16px;
            }
            .messages-container {
                padding: 16px;
            }
            .input-area {
                padding: 12px 15px;
            }
            .input-area input {
                padding: 11px 15px;
                font-size: 14px;
            }
            .input-area button {
                padding: 11px 20px;
                font-size: 14px;
            }
        }
        @media (max-width: 480px) {
            .message {
                max-width: 88%;
                padding: 9px 12px;
                font-size: 13px;
                border-radius: 8px;
            }
            .message-time {
                font-size: 10px;
            }
            .header {
                padding: 12px 14px;
            }
            .header h2 {
                font-size: 15px;
            }
            .messages-container {
                padding: 12px;
                gap: 10px;
            }
            .input-area {
                padding: 10px 12px;
                gap: 8px;
            }
            .input-area input {
                padding: 10px 14px;
                font-size: 13px;
            }
            .input-area button {
                padding: 10px 18px;
                font-size: 13px;
            }
        }
        @media (max-width: 375px) {
            .message {
                max-width: 90%;
                padding: 8px 11px;
                font-size: 12px;
            }
            .header h2 {
                font-size: 14px;
            }
            .messages-container {
                padding: 10px;
            }
            .input-area input {
                padding: 9px 12px;
                font-size: 12px;
            }
            .input-area button {
                padding: 9px 16px;
                font-size: 12px;
            }
        }
        @media (max-width: 320px) {
            .message {
                max-width: 92%;
                padding: 7px 10px;
                font-size: 11px;
            }
            .header {
                padding: 10px 12px;
            }
            .header h2 {
                font-size: 13px;
            }
            .input-area {
                padding: 8px 10px;
            }
            .input-area input {
                padding: 8px 10px;
                font-size: 11px;
            }
            .input-area button {
                padding: 8px 14px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Message <span class="mentor-name" id="mentorName">Loading...</span></h2>
        <button onclick="window.close()" style="background:none;border:none;color:#999;cursor:pointer;font-size:20px;">&times;</button>
    </div>
    
    <div class="messages-container" id="messagesContainer">
        <div class="empty-state">No messages yet. Start the conversation!</div>
    </div>
    
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Type your message..." />
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        // Get parameters
        const urlParams = new URLSearchParams(window.location.search);
        const recipientId = urlParams.get('with');
        const mentorName = urlParams.get('mentorName') || 'Mentor';
        
        // For demo, we'll use localStorage to simulate current user
        const _authUser = (function(){ try{ return JSON.parse(localStorage.getItem('cinda_user')||'null'); }catch(e){return null;} })();
        const currentUserId = _authUser ? _authUser._id : 'u1';

        document.getElementById('mentorName').textContent = decodeURIComponent(mentorName);
        
        let messages = [];

        // Load messages
        async function loadMessages() {
            try {
                const res = await fetch(`/api/messages.php?user_id=${currentUserId}&with=${recipientId}`);
                messages = await res.json();
                renderMessages();
            } catch (err) {
                console.error('Error loading messages:', err);
            }
        }

        // Render messages
        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            
            if (messages.length === 0) {
                container.innerHTML = '<div class="empty-state">No messages yet. Start the conversation!</div>';
                return;
            }
            
            container.innerHTML = messages.map(msg => {
                const isSent = msg.sender_id === currentUserId;
                const time = new Date(msg.created_at).toLocaleTimeString('en-US', { 
                    hour: 'numeric', 
                    minute: '2-digit' 
                });
                
                return `
                    <div class="message ${isSent ? 'sent' : 'received'}">
                        <div>${msg.message}</div>
                        <div class="message-time">${time}</div>
                    </div>
                `;
            }).join('');
            
            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        // Send message
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            try {
                const res = await fetch('/api/messages.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sender_id: currentUserId,
                        receiver_id: recipientId,
                        message: message
                    })
                });
                
                const result = await res.json();
                
                if (result.success) {
                    input.value = '';
                    loadMessages();
                } else {
                    alert('Failed to send message: ' + (result.error || 'Unknown error'));
                }
            } catch (err) {
                console.error('Error sending message:', err);
                alert('Failed to send message. Please try again.');
            } finally {
                sendBtn.disabled = false;
            }
        }

        // Send on Enter key
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Load messages on page load and refresh every 3 seconds
        loadMessages();
        setInterval(loadMessages, 3000);
    </script>
<script src="cinda-app.js"></script>

<script id="msg-sidebar-inject">
document.addEventListener('DOMContentLoaded', function(){
  var sidebar = document.querySelector('.conversations-list,.conversation-list,.contacts-list,.sidebar-contacts');
  if(!sidebar) return;
  var mentors = (window.CindaData||{}).mentors||[];
  var currentWith = new URLSearchParams(location.search).get('with') || 'm1';
  sidebar.innerHTML = mentors.slice(0,6).map(function(m){
    var isActive = m._id === currentWith;
    return '<div onclick="location.href='messages.html?with='+m._id+'&mentorName='+encodeURIComponent(m.name)+''" '+
      'style="display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05);transition:background .2s;'+(isActive?'background:rgba(229,9,20,.1);border-left:3px solid #e50914':'')+'" '+
      'onmouseover="if(!this.style.borderLeft)this.style.background='rgba(255,255,255,.04)'" onmouseout="if(!''+isActive+'')this.style.background=''">'+
      '<div style="width:42px;height:42px;border-radius:50%;background:url('+m.image+') center/cover;flex-shrink:0;border:2px solid '+(isActive?'#e50914':'rgba(255,255,255,.1)')+'"></div>'+
      '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;color:#f0f0f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+m.name+'</div>'+
      '<div style="font-size:11px;color:#666680;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+m.specialties[0]+'</div></div>'+
      (isActive?'<div style="width:8px;height:8px;border-radius:50%;background:#e50914;flex-shrink:0"></div>':'')+
      '</div>';
  }).join('');
});
</script>
</body>
</html>
