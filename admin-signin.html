<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="cinda-theme.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In - Ci-NDA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #0a0a0a 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signin-container {
            max-width: 450px;
            width: 90%;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(229, 9, 20, 0.2);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            color: #e50914;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .admin-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(229, 9, 20, 0.2);
            border: 1px solid #e50914;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #e50914;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .welcome-text {
            text-align: center;
            margin-bottom: 35px;
        }

        .welcome-text h2 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .welcome-text p {
            font-size: 14px;
            color: #999;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #b3b3b3;
        }

        .form-input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: white;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #e50914;
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.15);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #b3b3b3;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .forgot-link {
            color: #e50914;
            text-decoration: none;
            transition: all 0.3s;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-signin {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #e50914 0%, #f40612 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-signin:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.4);
        }

        .btn-signin:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            position: relative;
            background: #1a1a1a;
            padding: 0 15px;
            color: #666;
            font-size: 13px;
        }

        .back-home {
            text-align: center;
            margin-top: 25px;
        }

        .back-home a {
            color: #999;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
        }

        .back-home a:hover {
            color: white;
        }

        .error-message {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            color: #ff6b6b;
            font-size: 14px;
            display: none;
        }

        .success-message {
            background: rgba(70, 211, 105, 0.2);
            border: 1px solid #46d369;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            color: #46d369;
            font-size: 14px;
            display: none;
        }

        @media (max-width: 768px) {
            .signin-container {
                padding: 40px 30px;
            }

            .logo {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="signin-container">
        <div class="logo-section">
            <div class="logo">Ci-NDA</div>
            <span class="admin-badge">Admin Panel</span>
        </div>

        <div class="welcome-text">
            <h2>Welcome Back</h2>
            <p>Sign in to access the admin dashboard</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form id="adminSigninForm">
            <div class="form-group">
                <label class="form-label">Admin Email</label>
                <input type="email" class="form-input" id="adminEmail" placeholder="admin@cinda.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="adminPassword" placeholder="Enter your password" required>
            </div>

            <div class="remember-forgot">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="btn-signin">Sign In</button>
        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <div class="back-home">
            <a href="index.html">← Back to Homepage</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('adminSigninForm');
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');

        // Admin credentials (in production, this should be validated server-side)
        const ADMIN_CREDENTIALS = {
            email: 'admin@cinda.com',
            password: 'admin123'
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const remember = document.getElementById('rememberMe').checked;

            // Hide previous messages
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            // Validate credentials
            if (email === ADMIN_CREDENTIALS.email && password === ADMIN_CREDENTIALS.password) {
                // Create admin session
                const adminSession = {
                    isAdmin: true,
                    email: email,
                    loginTime: new Date().toISOString()
                };

                // Store in localStorage or sessionStorage
                if (remember) {
                    localStorage.setItem('admin_session', JSON.stringify(adminSession));
                } else {
                    sessionStorage.setItem('admin_session', JSON.stringify(adminSession));
                }

                // Show success message
                successMsg.textContent = '✓ Sign in successful! Redirecting...';
                successMsg.style.display = 'block';

                // Redirect to admin dashboard
                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 1000);

            } else {
                // Show error message
                errorMsg.textContent = '✕ Invalid email or password. Please try again.';
                errorMsg.style.display = 'block';
            }
        });

        // Check if already signed in
        document.addEventListener('DOMContentLoaded', () => {
            const session = localStorage.getItem('admin_session') || sessionStorage.getItem('admin_session');
            if (session) {
                try {
                    const adminData = JSON.parse(session);
                    if (adminData.isAdmin) {
                        window.location.href = 'admin-dashboard.html';
                    }
                } catch (e) {
                    console.error('Invalid session data');
                }
            }
        });
    </script>
<script src="cinda-app.js"></script>
</body>
</html>
