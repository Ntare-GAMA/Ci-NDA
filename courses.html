<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="cinda-theme.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses - Ci-NDA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #141414;
            color: white;
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background-color: #141414;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #e50914;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #b3b3b3;
        }

        .main-content {
            padding: 100px 50px 50px;
        }

        .page-header {
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .page-header p {
            font-size: 18px;
            color: #b3b3b3;
            max-width: 800px;
        }

        .filter-section {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            background: #2a2a2a;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #e50914;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .course-card {
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .course-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.3);
        }

        .course-image {
            width: 100%;
            height: 200px;
            position: relative;
            overflow: hidden;
            background: #1a1a1a;
        }

        .course-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .course-card:hover .course-image img {
            transform: scale(1.1);
        }

        .course-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.7) 100%);
        }

        .course-content {
            padding: 20px;
        }

        .course-category {
            display: inline-block;
            padding: 4px 12px;
            background: #e50914;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .course-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .course-instructor {
            font-size: 14px;
            color: #b3b3b3;
            margin-bottom: 10px;
        }

        .course-description {
            font-size: 14px;
            color: #999;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .course-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #3a3a3a;
        }

        .course-duration {
            font-size: 13px;
            color: #46d369;
        }

        .course-level {
            font-size: 13px;
            padding: 4px 10px;
            background: #3a3a3a;
            border-radius: 3px;
        }

        .enroll-btn {
            width: 100%;
            padding: 12px;
            background: #e50914;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .enroll-btn:hover {
            background: #f40612;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 20px;
            }

            .main-content {
                padding: 100px 20px 50px;
            }

            .page-header h1 {
                font-size: 32px;
            }

            .courses-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body><script src="public/js/api.js"></script>
    <nav class="navbar">
        <div class="logo">Ci-NDA</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="courses.html" style="color: #e50914;">Courses</a>
            <a href="opportunities.html">Opportunities</a>
            <a href="mentorship.html">Mentorship</a>
            <a href="portfolios.html">Portfolios</a>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-header">
            <h1>Film Courses & Training</h1>
            <p>Master the art of filmmaking with industry-leading courses taught by award-winning professionals. From beginner to advanced, find the perfect course to elevate your skills.</p>
        </div>

        <div class="filter-section">
            <button class="filter-btn active">All Courses</button>
            <button class="filter-btn">Beginner</button>
            <button class="filter-btn">Intermediate</button>
            <button class="filter-btn">Advanced</button>
            <button class="filter-btn">Cinematography</button>
            <button class="filter-btn">Editing</button>
            <button class="filter-btn">Directing</button>
            <button class="filter-btn">Sound Design</button>
        </div>

        <div class="courses-grid"></div>
    </div>

    <script>
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                filterBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });
        let allCourses = [];

async function loadCourses(filter = null) {
  try {
    const filters = {};
    if (filter && filter !== 'All Courses') {
      if (['Beginner', 'Intermediate', 'Advanced'].includes(filter)) {
        filters.level = filter;
      } else {
        filters.category = filter;
      }
    }

    const courses = await api.getCourses(filters);
    allCourses = courses;
    renderCourses(courses);
  } catch (error) {
    console.error('Error loading courses:', error);
    alert('Failed to load courses. Please refresh the page.');
  }
}

function renderCourses(courses) {
  const grid = document.querySelector('.courses-grid');
  if (!grid) return;

  grid.innerHTML = courses.map(course => `
    <div class="course-card" data-course-id="${course._id}">
      <div class="course-image">
        <img src="${course.image || 'images/default-course.jpg'}" alt="${course.title}">
      </div>
      <div class="course-content">
        <span class="course-category">${course.category}</span>
        <h3 class="course-title">${course.title}</h3>
        <p class="course-instructor">By ${course.instructor.name}</p>
        <p class="course-description">${course.description}</p>
        <div class="course-meta">
          <span class="course-duration">${course.duration}</span>
          <span class="course-level">${course.level}</span>
        </div>
<button class="enroll-btn" onclick="window.location.href='enroll-course.html?courseId=${course._id}'">Enroll Now</button>      
</div>
    </div>
  `).join('');
}

async function enrollCourse(courseId) {
  if (!localStorage.getItem('authToken')) {
    alert('Please sign in to enroll in courses');
    window.location.href = 'authentication.html';
    return;
  }

  try {
    await api.enrollInCourse(courseId);
    alert('✅ Successfully enrolled in course!');
  } catch (error) {
    alert('❌ Enrollment failed: ' + error.message);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  loadCourses();

  const filterBtns = document.querySelectorAll('.filter-btn');
  filterBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      filterBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      loadCourses(this.textContent);
    });
  });
});
        </script>
<script src="cinda-app.js"></script>
</body>
</html>
