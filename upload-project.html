<!doctype html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="cinda-theme.css">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Upload Project</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{background:#141414;color:#fff;font-family:'Helvetica Neue',Arial,sans-serif;padding:30px;-webkit-font-smoothing:antialiased;min-height:100vh}
h1{font-size:32px;margin-bottom:15px;color:#e50914}
p{color:#b3b3b3;line-height:1.6;font-size:16px}
@media(max-width:768px){body{padding:20px}h1{font-size:28px}p{font-size:15px}}
@media(max-width:480px){body{padding:15px}h1{font-size:24px}p{font-size:14px}}
@media(max-width:375px){body{padding:12px}h1{font-size:22px}}
</style>
</head>
<body>
<h1>Upload Project</h1>
<p>Upload stub. Implement upload form and file handling here.</p>
<script src="cinda-app.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function(){
  var form = document.querySelector('form');
  if(form && !form.dataset.patched){
    form.dataset.patched='1';
    form.addEventListener('submit', function(e){
      e.preventDefault();
      CindaToast('Project submitted for review!');
      setTimeout(function(){ window.location.href='profile.html'; }, 1500);
    });
  }
});
</script>
</body>
</html>
