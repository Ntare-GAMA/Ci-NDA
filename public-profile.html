<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no" />
  <title>Mentor Profile — Ci-NDA</title>
  <style>
    :root{
      --bg-1:#0f0f0f; --bg-2:#101010; --card:#151515; --muted:#b3b3b3; --accent:#e50914; --accent-2:#46d369;
      --maxw:1100px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter, 'Helvetica Neue', Arial, sans-serif;color:#fff;
      background:
        linear-gradient(rgba(8,8,8,0.65), rgba(8,8,8,0.65)),
        radial-gradient(800px 600px at 50% 20%, rgba(229,9,20,0.06), transparent 60%),
        url('https://media.cnn.com/api/v1/images/stellar/prod/highest2lowest-feature-11061f-f.jpg?c=16x9&q=w_1544,c_fill/f_avif') center/cover no-repeat fixed;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
    a{color:inherit}
    .navbar{display:flex;align-items:center;justify-content:space-between;padding:20px 40px;border-bottom:1px solid rgba(255,255,255,0.05);position:sticky;top:0;background:rgba(10,10,10,0.95);backdrop-filter:blur(10px);z-index:100}
    .logo{font-weight:800;font-size:28px;color:var(--accent);cursor:pointer;letter-spacing:1px}
    .container{max-width:var(--maxw);margin:40px auto;padding:0 20px}
    .card{background:linear-gradient(180deg, rgba(21,21,21,0.95), rgba(18,18,18,0.9));border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.05)}
    .hero{display:flex;gap:40px;padding:40px;align-items:flex-start;background:linear-gradient(135deg, rgba(229,9,20,0.03), transparent 50%)}
    .hero-left{flex:0 0 180px}
    .avatar{width:180px;height:180px;border-radius:16px;background-size:cover;background-position:center;border:4px solid rgba(255,255,255,0.08);box-shadow:0 12px 40px rgba(0,0,0,0.7)}
    .hero-right{flex:1}
    .name{font-size:36px;font-weight:800;margin-bottom:8px;letter-spacing:-0.5px}
    .title{color:var(--accent-2);margin-bottom:12px;font-size:18px;font-weight:500}
    .meta{display:flex;gap:20px;color:var(--muted);font-size:14px;margin-bottom:12px;align-items:center}
    .meta-item{display:flex;align-items:center;gap:6px}
    .specialties{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
    .chip{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);padding:8px 14px;border-radius:20px;font-size:13px;color:#e0e0e0;transition:all 0.2s}
    .chip:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.12)}
    .actions{display:flex;gap:14px;margin-top:20px;flex-wrap:wrap}
    .btn{padding:14px 24px;border-radius:10px;border:none;cursor:pointer;font-weight:600;font-size:15px;transition:all 0.2s}
    .btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(229,9,20,0.25)}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(229,9,20,0.35)}
    .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.1);color:#fff}
    .btn-ghost:hover{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.15)}
    .body{padding:30px 40px;border-top:1px solid rgba(255,255,255,0.05)}
    .section{margin-bottom:32px}
    .section h3{margin:0 0 14px 0;font-size:20px;font-weight:700;color:#fff}
    .muted{color:var(--muted);line-height:1.7}
    .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-top:20px}
    .stat{background:rgba(255,255,255,0.03);padding:18px;border-radius:12px;text-align:center;border:1px solid rgba(255,255,255,0.05);transition:all 0.2s}
    .stat:hover{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.1)}
    .stat .num{color:var(--accent);font-weight:800;font-size:28px;margin-bottom:4px}
    .stat .label{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:0.5px}
    .back-link{font-size:14px;color:var(--muted);text-decoration:none;cursor:pointer;padding:14px 24px;border:1px solid rgba(255,255,255,0.08);border-radius:10px;transition:all 0.2s;display:inline-block}
    .back-link:hover{background:rgba(255,255,255,0.03);color:#fff}
    .stars{color:#fbbf24;letter-spacing:2px;font-size:18px}
    .insight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:12px}
    .insight-card{background:rgba(255,255,255,0.02);padding:16px;border-radius:10px;border:1px solid rgba(255,255,255,0.05)}
    .insight-card strong{color:#fff;display:block;margin-bottom:6px;font-size:14px}
    .insight-card .value{color:var(--accent-2);font-size:16px;font-weight:600}

    @media (max-width:880px){.hero{flex-direction:column;align-items:flex-start;gap:24px}.hero-left{width:140px}.avatar{width:140px;height:140px}.stat-grid{grid-template-columns:repeat(3,1fr)}}
    @media (max-width:480px){.navbar{padding:16px 20px}.logo{font-size:24px}.container{padding:0 16px}.hero{padding:24px}.body{padding:20px 24px}.name{font-size:28px}.title{font-size:16px}.stat .num{font-size:24px}.stat-grid{grid-template-columns:repeat(3,1fr);gap:12px}.insight-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo" onclick="location.href='index.html'">Ci-NDA</div>
    <div style="opacity:.9;font-size:14px">Mentor Profile</div>
  </nav>

  <main class="container">
    <div class="card" id="profileCard">
      <div class="hero">
        <div class="hero-left">
          <div id="avatar" class="avatar" style="background-image:url('https://images.unsplash.com/photo-1574267432644-f74f3e909713?w=400&q=80')"></div>
        </div>
        <div class="hero-right">
          <div class="name" id="name">Loading mentor...</div>
          <div class="title" id="title"></div>
          <div class="meta"><div id="location" class="muted"></div><div id="instructor" class="muted"></div></div>
          <div class="specialties" id="specialties"></div>
          <div class="actions">
              <button id="requestBtn" class="btn btn-primary">Request Mentorship</button>
              <button id="messageBtn" class="btn btn-ghost">Send Message</button>
              <a class="back-link" href="mentorship.html">← Back to Mentors</a>
          </div>
          <div class="stat-grid">
            <div class="stat"><div class="num" id="mentees">0</div><div class="label">Mentees</div></div>
            <div class="stat"><div class="num" id="years">0+</div><div class="label">Years Exp</div></div>
            <div class="stat"><div class="num" id="spots">0</div><div class="label">Open Spots</div></div>
          </div>
        </div>
      </div>
      <div class="body">
        <div class="section">
          <h3>About</h3>
          <div id="bio" class="muted">—</div>
        </div>
        <div class="section">
          <h3>Expertise & Topics</h3>
          <div id="expertise" style="display:flex;gap:8px;flex-wrap:wrap"></div>
        </div>
        <div class="section">
          <h3>Insights</h3>
          <div id="insights" class="muted">—</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const qs = (k) => new URLSearchParams(location.search).get(k);
    const id = qs('mentorId');
    const mentorNameParam = qs('mentorName');
    // Try a few API endpoint variants so the page works with PHP or Node backends.
    const apiCandidates = id ? [
      `api/mentors.php?id=${encodeURIComponent(id)}`,
      `/api/mentors?id=${encodeURIComponent(id)}`,
      `api/mentors?id=${encodeURIComponent(id)}`
    ] : [
      'api/mentors.php',
      '/api/mentors',
      'api/mentors'
    ];

    async function load(){
      try{
        let res = null;
        let data = null;
        // try endpoints in order until one returns valid JSON
        for(const u of apiCandidates){
          try{
            console.log('Trying API endpoint:', u);
            res = await fetch(u, {cache: 'no-store'});
            console.log('Response status:', res.status);
            if(!res.ok) continue;
            data = await res.json();
            console.log('Data received:', data);
            // basic validation: expect object or array
            if(data && (Array.isArray(data) || typeof data === 'object')) break;
          }catch(err){
            console.error('Error fetching from', u, err);
            // try next candidate
            continue;
          }
        }
        if(!data || (data.error)) {
          console.error('No valid data or error in response:', data);
          throw new Error('network');
        }
        // if api returned a list, ensure we find by id
        let m = data;
        if(Array.isArray(data)){
          m = null;
          if(id) m = data.find(x => String(x._id) === String(id) || String(x.id) === String(id));
          else if(mentorNameParam){
            const decoded = decodeURIComponent(mentorNameParam.replace(/\+/g,' ')).toLowerCase();
            m = data.find(x => (x.name && x.name.toLowerCase() === decoded) || (x.name && x.name.toLowerCase().includes(decoded)) );
          } else {
            m = data[0];
          }
        }
        if(!m){
          // friendly fallback when mentor can't be located
          const card = document.getElementById('profileCard');
          card.innerHTML = `
            <div style="padding:28px">
              <h2>No mentor found</h2>
              <p class="muted">We couldn't find that mentor. Try browsing all mentors or pick another profile.</p>
              <div style="margin-top:16px">
                <a class="btn btn-ghost" href="mentorship.html">Back to Mentors</a>
                <a class="btn btn-primary" href="mentorship.html">Browse Mentors</a>
              </div>
            </div>`;
          return;
        }
        render(m);
      }catch(e){
        console.error(e);
        document.getElementById('name').textContent = 'Failed to load mentor';
      }
    }

    function render(m){
      document.getElementById('name').textContent = m.name || 'Unnamed';
      document.getElementById('title').textContent = m.title || 'Film Professional';
      document.getElementById('bio').textContent = m.bio || m.about || 'Experienced mentor passionate about nurturing the next generation of filmmakers.';
      document.getElementById('mentees').textContent = m.mentees ?? m.mentees_count ?? 0;
      document.getElementById('years').textContent = (m.years ?? m.years_mentoring ?? 0) + '+';
      document.getElementById('spots').textContent = m.spotsLeft ?? m.spots_left ?? 0;
      if(m.avatar) document.getElementById('avatar').style.backgroundImage = `url('${m.avatar}')`;
      // specialties: accept array or comma/semicolon-separated string
      let s = [];
      if(Array.isArray(m.specialties) && m.specialties.length) s = m.specialties;
      else if(typeof m.specialties === 'string' && m.specialties.trim()){
        s = m.specialties.split(/[,;]+/).map(x=>x.trim()).filter(Boolean);
      } else if(m.tags && Array.isArray(m.tags)){
        s = m.tags.slice();
      }
      document.getElementById('specialties').innerHTML = s.slice(0,6).map(t=>`<div class="chip">${t}</div>`).join('');
      document.getElementById('expertise').innerHTML = s.map(t=>`<div class="chip">${t}</div>`).join('');
      // Insights: rating, recent mentees, response time, availability (render stars)
      const rating = Number(m.rating_avg ?? m.avg_rating ?? m.rating ?? NaN);
      const responseTime = m.response_time ?? m.response_time_days ?? m.response_time_hours ?? '24-48 hrs';
      let recent = m.recentMentees ?? m.recent_mentees ?? m.recent ?? [];
      if(typeof recent === 'string') recent = recent.split(',').map(x=>x.trim()).filter(Boolean);
      const availability = (m.spotsLeft ?? m.spots_left ?? m.openings ?? 0);
      const insightsEl = document.getElementById('insights');
      const renderStars = (v) => {
        if(!isFinite(v)) return '<span class="muted">Not rated yet</span>';
        const rounded = Math.round(Math.max(0, Math.min(5, v)));
        return `<span class="stars">${'★'.repeat(rounded)}${'☆'.repeat(5-rounded)}</span> <span style="color:#fff;font-weight:600">${v.toFixed(1)}</span>`;
      };
      let recentHtml = '<span class="muted">Building mentee network</span>';
      if(Array.isArray(recent) && recent.length) recentHtml = `<ul style="margin:8px 0 0 20px;line-height:1.8">${recent.slice(0,5).map(r=>`<li>${r}</li>`).join('')}</ul>`;
      insightsEl.innerHTML = `
        <div class="insight-grid">
          <div class="insight-card">
            <strong>Rating</strong>
            <div class="value">${renderStars(rating)}</div>
          </div>
          <div class="insight-card">
            <strong>Response Time</strong>
            <div class="value">${responseTime}</div>
          </div>
          <div class="insight-card">
            <strong>Availability</strong>
            <div class="value">${availability > 0 ? `${availability} spot${availability !== 1 ? 's' : ''} available` : 'Currently full'}</div>
          </div>
        </div>
        <div style="margin-top:20px"><strong style="color:#fff;font-size:16px">Recent Mentees:</strong><br>${recentHtml}</div>
      `;

      // buttons: prefer numeric id, fallback to name param or name
      const ident = m._id ?? m.id ?? (mentorNameParam ? decodeURIComponent(mentorNameParam) : (m.name ?? ''));
      document.getElementById('requestBtn').addEventListener('click', ()=> {
        const namePart = encodeURIComponent(m.name ?? mentorNameParam ?? '');
        const target = `request-mentorship.html?mentorId=${encodeURIComponent(ident)}&mentorName=${namePart}`;
        location.href = target;
      });

      document.getElementById('messageBtn').addEventListener('click', ()=> {
        // open a small messaging popup; if popup blocked, redirect in current tab
        const wndName = `cinda_message_${String(ident).replace(/[^a-z0-9_-]/gi,'')}`;
        const features = 'width=420,height=640,menubar=no,toolbar=no,status=no,location=no,resizable=yes';
        const namePart = encodeURIComponent(m.name ?? mentorNameParam ?? '');
        const popup = window.open(`messages.html?with=${encodeURIComponent(ident)}&mentorName=${namePart}`, wndName, features);
        if(popup){
          try{ popup.focus(); }catch(e){}
        } else {
          // fallback: navigate in same tab
          location.href = `messages.html?with=${encodeURIComponent(ident)}`;
        }
      });
    }

    if(!id && !mentorNameParam){ document.getElementById('name').textContent = 'No mentor selected'; }
    else load();
  </script>
</body>
</html>
